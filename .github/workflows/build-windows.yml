name: Build Windows VST3 + Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source tree
        shell: pwsh
        run: |
          $parts = Get-ChildItem "payload\source.part*.b64" | Sort-Object Name
          if (-not $parts) { throw "Source payload parts were not found." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("rocktrigger-source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "rocktrigger-source.zip" -DestinationPath "work" -Force
          Get-ChildItem work

      - name: Dump DSP parameter sources
        shell: pwsh
        run: |
          Write-Host "=== CONTROLLER BEGIN ==="
          Get-Content "work\source\rocktriggercontroller.cpp" -Raw
          Write-Host "=== CONTROLLER END ==="
          Write-Host "=== PROCESSOR HEADER BEGIN ==="
          Get-Content "work\source\rocktriggerprocessor.h" -Raw
          Write-Host "=== PROCESSOR HEADER END ==="
          Write-Host "=== PROCESSOR CPP BEGIN ==="
          Get-Content "work\source\rocktriggerprocessor.cpp" -Raw
          Write-Host "=== PROCESSOR CPP END ==="
          Write-Host "=== IDS BEGIN ==="
          Get-Content "work\source\rocktriggerids.h" -Raw
          Write-Host "=== IDS END ==="
          Write-Host "=== CMAKE BEGIN ==="
          Get-Content "work\CMakeLists.txt" -Raw
          Write-Host "=== CMAKE END ==="

      - name: Apply SDK and Windows compatibility fixes
        shell: pwsh
        run: |
          $idsPath = "work\source\rocktriggerids.h"
          $ids = Get-Content $idsPath -Raw
          $ids = $ids.Replace("static const FUID kProcessorUID (0xF5DFA5DC, 0x94C4461F, 0x80391E58, 0x150063F1);", "static DECLARE_UID (kProcessorUID, 0xF5DFA5DC, 0x94C4461F, 0x80391E58, 0x150063F1);")
          $ids = $ids.Replace("static const FUID kControllerUID (0x71713D93, 0x192A465B, 0xB9DE9A96, 0x960DD4EF);", "static DECLARE_UID (kControllerUID, 0x71713D93, 0x192A465B, 0xB9DE9A96, 0x960DD4EF);")
          Set-Content -Path $idsPath -Value $ids -NoNewline

          $controllerPath = "work\source\rocktriggercontroller.cpp"
          $controller = Get-Content $controllerPath -Raw
          $controller = $controller.Replace("USTRING (", "STR16 (")
          Set-Content -Path $controllerPath -Value $controller -NoNewline

          $bankPath = "work\source\samplebank.cpp"
          $bank = Get-Content $bankPath -Raw
          $old = "#if defined(_WIN32)`n#include <windows.h>"
          $new = "#if defined(_WIN32)`n#ifndef NOMINMAX`n#define NOMINMAX`n#endif`n#include <windows.h>"
          $bank = $bank.Replace($old, $new)
          Set-Content -Path $bankPath -Value $bank -NoNewline

      - name: Configure
        shell: pwsh
        run: |
          cmake -S work -B work/build -G "Visual Studio 17 2022" -A x64 -DSMTG_CREATE_PLUGIN_LINK=0

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build work/build --config Release --target RockTrigger --parallel

      - name: Stage VST3 bundle
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path work/build -Recurse -Directory -Filter "RockTrigger.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "RockTrigger.vst3 was not found after the build." }
          New-Item -ItemType Directory -Force -Path work/dist | Out-Null
          Copy-Item $plugin.FullName "work\dist\RockTrigger.vst3" -Recurse -Force
          Write-Host "Staged $($plugin.FullName)"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build EXE installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found." }
          & $iscc "work\installer\RockTrigger.iss"

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: RockTrigger-v0.2.0-VST3-Windows-x64
          path: work/dist/RockTrigger.vst3
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RockTrigger-v0.2.0-Windows-x64-Setup
          path: work/installer/output/*.exe
          if-no-files-found: error
