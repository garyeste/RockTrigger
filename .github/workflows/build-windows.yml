name: Build SuperPowers Windows VST3 + Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore base source tree
        shell: pwsh
        run: |
          $parts = Get-ChildItem "payload\source.part*.b64" | Sort-Object Name
          if (-not $parts) { throw "Source payload parts were not found." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("rocktrigger-source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "rocktrigger-source.zip" -DestinationPath "work" -Force

      - name: Apply SuperPowers v1.0.2 source and GUI
        shell: pwsh
        run: |
          Copy-Item "overrides\CMakeLists.txt" "work\CMakeLists.txt" -Force
          Copy-Item "overrides\installer\RockTrigger.iss" "work\installer\RockTrigger.iss" -Force
          Copy-Item "overrides\resource\rocktrigger.uidesc" "work\resource\rocktrigger.uidesc" -Force

          Copy-Item "overrides\source\rocktriggerids.h" "work\source\rocktriggerids.h" -Force
          Copy-Item "overrides\source\rocktriggerprocessor.h" "work\source\rocktriggerprocessor.h" -Force
          Copy-Item "overrides\source\rocktriggercontroller.cpp" "work\source\rocktriggercontroller.cpp" -Force
          Copy-Item "overrides\source\rocktriggerentry.cpp" "work\source\rocktriggerentry.cpp" -Force

          $processorB64 = Get-Content "overrides\source\rocktriggerprocessor.cpp.b64" -Raw
          [IO.File]::WriteAllBytes("work\source\rocktriggerprocessor.cpp", [Convert]::FromBase64String($processorB64))

          $assets = @(
            "ge_logo.png",
            "superpowers_title.png",
            "knob_face.png",
            "waveform_panel.png",
            "meter.png"
          )
          foreach ($asset in $assets) {
            $assetB64 = Get-Content "overrides\assets\$asset.b64" -Raw
            [IO.File]::WriteAllBytes("work\resource\$asset", [Convert]::FromBase64String($assetB64))
          }

          Write-Host "SuperPowers source overrides applied."
          Get-ChildItem "work\resource"

      - name: Apply realtime GUI hotfix
        shell: pwsh
        run: |
          $partNames = @(
            "hotfix\superpowers-hotfix.part00.b64",
            "hotfix\superpowers-hotfix.part01.b64",
            "hotfix\superpowers-hotfix.part02.b64",
            "hotfix\superpowers-hotfix.part03a.b64",
            "hotfix\superpowers-hotfix.part03b1.b64",
            "hotfix\superpowers-hotfix.part03b2.b64",
            "hotfix\superpowers-hotfix.part04.b64",
            "hotfix\superpowers-hotfix.part05.b64",
            "hotfix\superpowers-hotfix.part06.b64"
          )
          foreach ($p in $partNames) { if (-not (Test-Path $p)) { throw "Missing hotfix part: $p" } }
          $b64 = ($partNames | ForEach-Object { Get-Content $_ -Raw }) -join ""
          [IO.File]::WriteAllBytes("superpowers-hotfix.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "superpowers-hotfix.zip" -DestinationPath "work" -Force

          # Remove an obsolete VSTGUI call; CView transparency is controlled by view attributes.
          $customViews = "work\source\customviews.cpp"
          $cv = Get-Content $customViews -Raw
          $cv = $cv -replace "\s*setTransparent \(true\);", ""
          Set-Content -Path $customViews -Value $cv -NoNewline

          Write-Host "Realtime GUI hotfix applied."

      - name: Apply current SDK and Windows compatibility fixes
        shell: pwsh
        run: |
          $idsPath = "work\source\rocktriggerids.h"
          $ids = Get-Content $idsPath -Raw
          $ids = $ids.Replace("static const FUID kProcessorUID (0xF5DFA5DC, 0x94C4461F, 0x80391E58, 0x150063F1);", "static DECLARE_UID (kProcessorUID, 0xF5DFA5DC, 0x94C4461F, 0x80391E58, 0x150063F1);")
          $ids = $ids.Replace("static const FUID kControllerUID (0x71713D93, 0x192A465B, 0xB9DE9A96, 0x960DD4EF);", "static DECLARE_UID (kControllerUID, 0x71713D93, 0x192A465B, 0xB9DE9A96, 0x960DD4EF);")
          Set-Content -Path $idsPath -Value $ids -NoNewline

          $controllerPath = "work\source\rocktriggercontroller.cpp"
          $controller = Get-Content $controllerPath -Raw
          $controller = $controller.Replace("USTRING (", "STR16 (")
          Set-Content -Path $controllerPath -Value $controller -NoNewline

          $bankPath = "work\source\samplebank.cpp"
          $bank = Get-Content $bankPath -Raw
          $nl = [Environment]::NewLine
          $old = "#if defined(_WIN32)" + $nl + "#include <windows.h>"
          $new = "#if defined(_WIN32)" + $nl + "#ifndef NOMINMAX" + $nl + "#define NOMINMAX" + $nl + "#endif" + $nl + "#include <windows.h>"
          $bank = $bank.Replace($old, $new)
          Set-Content -Path $bankPath -Value $bank -NoNewline

      - name: Configure
        shell: pwsh
        run: |
          cmake -S work -B work/build -G "Visual Studio 17 2022" -A x64 -DSMTG_CREATE_PLUGIN_LINK=0

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build work/build --config Release --target SuperPowers --parallel

      - name: Stage VST3 bundle
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path work/build -Recurse -Directory -Filter "SuperPowers.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "SuperPowers.vst3 was not found after the build." }
          New-Item -ItemType Directory -Force -Path work/dist | Out-Null
          Copy-Item $plugin.FullName "work\dist\SuperPowers.vst3" -Recurse -Force
          Write-Host "Staged $($plugin.FullName)"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build EXE installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found." }
          & $iscc "work\installer\RockTrigger.iss"

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: SuperPowers-v1.0.2-VST3-Windows-x64
          path: work/dist/SuperPowers.vst3
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SuperPowers-v1.0.2-Windows-x64-Setup
          path: work/installer/output/*.exe
          if-no-files-found: error
